[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-dp-accounting"
version = "0.1.0"
description = "DP accounting and closed-form semantic budget allocation for semantic communication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
train = ["torch>=2.0"]
measured = ["pyarrow>=14.0", "pillow>=9.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["sdpa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]
